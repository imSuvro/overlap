name: Deploy

# Production deploys happen only from main, and only after CI has passed on main.
# This keeps the live URL in lockstep with the tagged, reviewed history.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://overlap.purple-larkspur.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy Worker and Durable Object
        run: pnpm --filter @overlap/edge run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The same end-to-end suite, run against the origin that was just deployed. A green
      # build proves the artifact is sound; this proves the deployment is.
      - name: Verify the deployment
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
        env:
          OVERLAP_BASE_URL: ${{ vars.PRODUCTION_URL || 'https://overlap.purple-larkspur.workers.dev' }}
